# Verificacion de cada push y cada PR. Dos jobs en paralelo, sin dependencia
# entre ellos: un fallo del front no debe esconder el resultado del back.
#
# La regla de oro de docs/08-calidad.md: si CI pasa, `devherd serve` funciona.
# Cuando eso deje de ser cierto, se arregla CI, no se ignora.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: nadie mira el
# resultado de un commit que ya fue reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          # 21 porque es lo que declara api/pom.xml. El runner trae otra version
          # por omision, y compilar con una y desplegar con otra es como se
          # descubren incompatibilidades en produccion.
          java-version: '21'
          distribution: temurin
          cache: maven

      # 'verify', no 'test': las pruebas de integracion se llaman *IT y las corre
      # Failsafe. Con 'mvn test' esto pasaria en verde sin ejecutar ninguna.
      # Testcontainers levanta Postgres usando el Docker del runner, sin
      # configuracion extra.
      - name: mvn verify
        run: ./mvnw -B verify

  frontend:
    name: frontend (tipos, build y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          # Misma version que el contenedor de desarrollo.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 'ci' y no 'install': respeta el lockfile y falla si esta desincronizado
      # del package.json, en vez de arreglarlo en silencio.
      - name: npm ci
        run: npm ci

      # 'build' ya encadena `vue-tsc -b`, asi que verifica tipos y compilacion
      # en un paso. Va primero para que un error de tipos salga antes que un
      # fallo de asercion, que es mas barato de leer.
      - name: tipos y build
        run: npm run build

      # 'test:run' y no 'test': `vitest` a secas se queda en modo watch y el job
      # colgaria hasta el timeout del runner.
      - name: tests
        run: npm run test:run
