spring:
  flyway:
    # 'db/seed' solo se agrega aqui. En produccion el seed no esta en el
    # classpath, asi que no hay condicional que pueda equivocarse.
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      # En dev queremos ver el detalle de la base en /api/actuator/health.
      show-details: always

logging:
  level:
    org.flywaydb: info

app:
  security:
    jwt:
      # Clave fija de desarrollo, no un secreto: esta en el repositorio a
      # proposito. Es fija y no generada porque devtools reinicia el contexto
      # con cada recompilacion, y con clave nueva cada reinicio cerraria la
      # sesion mientras se trabaja. En 'prod' esta clave no existe.
      secret: desarrollo-java-starter-clave-de-firma-no-secreta
