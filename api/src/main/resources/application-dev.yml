spring:
  flyway:
    # 'db/seed' solo se agrega aqui. En produccion el seed no esta en el
    # classpath, asi que no hay condicional que pueda equivocarse.
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      # En dev queremos ver el detalle de la base en /api/actuator/health.
      show-details: always

logging:
  level:
    org.flywaydb: info
