spring:
  application:
    name: java-starter

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway es el unico que toca el esquema. Nunca 'update'.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # El backend vive bajo /api de punta a punta: el 'edge' no reescribe rutas,
  # asi que la URL es identica llamando por el proxy o directo al contenedor.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# El contrato que consume el generador del cliente TypeScript (HU-004).
springdoc:
  api-docs:
    # Relativa al context-path, igual que todo lo demas: el documento sale en
    # /api/openapi.json, no en /openapi.json.
    path: /openapi.json

  # Sin esto springdoc declara que /auth/me produce '*/*', y el cliente generado
  # hereda ese comodin. El API solo habla JSON.
  default-produces-media-type: application/json

  # Las dos siguientes existen para que el documento sea *diffeable*. Sin ellas
  # Jackson escribe las claves en el orden en que Spring descubrio los handlers,
  # que cambia entre arranques: regenerar dos veces sin tocar el backend
  # produciria un diff distinto cada vez, y entonces el diff deja de significar
  # "el contrato cambio". Ver la decision pendiente sobre versionar 'generated/'.
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# Modelo de sesion de la Decision 003: JWT corto en cookie HttpOnly y refresh
# opaco rotado. Las dos vidas son configuracion y no constantes porque son la
# primera perilla que se toca al diagnosticar un problema de sesion.
app:
  security:
    jwt:
      # Vacio significa "genera una clave efimera al arrancar". En 'prod' eso
      # aborta el arranque: ver SecurityInProductionGuard.
      secret: ${JWT_SECRET:}
      ttl: 15m
    refresh:
      ttl: 14d
    cookies:
      # 'Secure' exige HTTPS, y el stack local va por HTTP plano. Obligatorio
      # en 'prod', donde la guarda lo verifica.
      secure: ${COOKIE_SECURE:false}
