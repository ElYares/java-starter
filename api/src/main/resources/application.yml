spring:
  application:
    name: java-starter

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway es el unico que toca el esquema. Nunca 'update'.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # El backend vive bajo /api de punta a punta: el 'edge' no reescribe rutas,
  # asi que la URL es identica llamando por el proxy o directo al contenedor.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
