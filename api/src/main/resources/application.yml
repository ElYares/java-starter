spring:
  application:
    name: java-starter

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway es el unico que toca el esquema. Nunca 'update'.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # El backend vive bajo /api de punta a punta: el 'edge' no reescribe rutas,
  # asi que la URL es identica llamando por el proxy o directo al contenedor.
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Modelo de sesion de la Decision 003: JWT corto en cookie HttpOnly y refresh
# opaco rotado. Las dos vidas son configuracion y no constantes porque son la
# primera perilla que se toca al diagnosticar un problema de sesion.
app:
  security:
    jwt:
      # Vacio significa "genera una clave efimera al arrancar". En 'prod' eso
      # aborta el arranque: ver SecurityInProductionGuard.
      secret: ${JWT_SECRET:}
      ttl: 15m
    refresh:
      ttl: 14d
    cookies:
      # 'Secure' exige HTTPS, y el stack local va por HTTP plano. Obligatorio
      # en 'prod', donde la guarda lo verifica.
      secure: ${COOKIE_SECURE:false}
